<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baseline: Enhanced Existing</title>
    <style>
        body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f8f8f8; color: #222; }
        .slide { min-height: 100vh; padding: 56px; }
        .cards { display: flex; gap: 24px; }
        .card { padding: 24px; background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <section class="slide">
        <h1>Existing HTML Deck</h1>
        <p>Simple styling update without a presentation runtime.</p>
    </section>
    <section class="slide">
        <h2>Enhancements</h2>
        <div class="cards">
            <div class="card">Better colors</div>
            <div class="card">Cleaner type</div>
            <div class="card">Updated layout</div>
        </div>
    </section>
    <section class="slide">
        <h2>Validation</h2>
        <p>This baseline lacks navigation, reveal states, and progress feedback.</p>
    </section>
</body>
</html>
